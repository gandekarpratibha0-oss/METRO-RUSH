  sleepers.forEach(s=>{s.position.z+=speed*dt;if(s.position.z>15)s.position.z-=140});cityBlocks.forEach(g=>{g.position.z+=speed*dt;if(g.position.z>14)g.position.z-=129});gantries.forEach(g=>{g.position.z+=speed*dt;if(g.position.z>14)g.position.z-=144});lamps.forEach(g=>{g.position.z+=speed*dt;if(g.position.z>14)g.position.z-=135});
  for(const o of active){o.mesh.position.z+=speed*dt;if(o.type==='coin'){o.mesh.rotation.y+=dt*2.8;o.mesh.position.y=o.baseY+Math.sin(now*.004+o.lane)*.12}
    const inLane=Math.abs(playerX-laneX[o.lane])<1.05,nearPlayer=o.type==='train'?o.mesh.position.z> -7&&o.mesh.position.z<7:o.mesh.position.z>-.9&&o.mesh.position.z<1.1;
    if(!o.hit&&inLane&&nearPlayer){if(o.type==='coin'){o.hit=true;coins++;score+=35;coinsEl.textContent=coins;scoreEl.textContent=Math.floor(score);coinBox.classList.remove('bump');void coinBox.offsetWidth;coinBox.classList.add('bump')}else if(o.type==='low'&&jumpY<.95&&slideTime<=0){end();return}else if(o.type==='high'&&slideTime<=0){end();return}else if(o.type==='high'&&slideTime>0){o.hit=true}else if(o.type==='train'){end();return}}
  }
  scoreEl.textContent=Math.floor(score);active=active.filter(o=>{if(o.mesh.position.z>12||o.hit){disposeObject(o);return false}return true});
}
let renderWidth=0,renderHeight=0;function resize(){const r=canvas.getBoundingClientRect();if(!r.width||!r.height||(r.width===renderWidth&&r.height===renderHeight))return;renderWidth=r.width;renderHeight=r.height;renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}
function render(dt=1/60){resize();camera.position.x+=(playerX*.19-camera.position.x)*(1-Math.exp(-3.6*dt));camera.lookAt(playerX*.12,1.05,-8);renderer.render(scene,camera)}
addEventListener('resize',resize);resize();function idle(){if(!running){render();requestAnimationFrame(idle)}}idle();
</script>
